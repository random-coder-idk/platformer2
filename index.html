<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Neon Runner X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#02020a;
overflow:hidden;
font-family:Arial,sans-serif;

}

canvas{

display:block;
margin:auto;
background:linear-gradient(#050518,#170030);
image-rendering:pixelated;

}

#ui{

position:absolute;
top:10px;
left:10px;

color:#00ffff;

font-size:20px;

text-shadow:0 0 10px cyan;

z-index:10;

}

#message{

position:absolute;

width:100%;

top:45%;

text-align:center;

font-size:48px;

font-weight:bold;

color:white;

display:none;

text-shadow:

0 0 10px cyan,
0 0 25px magenta,
0 0 50px cyan;

}

</style>

</head>

<body>

<div id="ui"></div>

<div id="message"></div>

<canvas
id="game"
width="1280"
height="720">
</canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ui=document.getElementById("ui");
const message=document.getElementById("message");

const WIDTH=canvas.width;
const HEIGHT=canvas.height;

const gravity=.8;

const keys={};

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

});

document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});

const saveData=JSON.parse(

localStorage.getItem("neonrunnerx")

||

"null"

);

const game={

level:0,

boss:false,

state:"platform",

won:false,

cameraX:0

};

const player={

x:80,
y:100,

w:40,
h:56,

vx:0,
vy:0,

speed:5,

jump:15,

ground:false,

dash:0,

health:5,

laserCooldown:0,

highJump:false,

direction:1

};

if(saveData){

game.level=saveData.level||0;

player.health=saveData.health||5;

player.highJump=saveData.highJump||false;

if(player.highJump){

player.jump=22;

}

}

const bullets=[];

const enemyBullets=[];

const enemies=[];

const platforms=[];

let portal={};

const hiddenUpgrade={

x:18,
y:660,

w:14,
h:14,

found:player.highJump

};

/*

THIS IS THE ONLY ITEM
IN THE ENTIRE GAME.

It exists ONLY on Level 1.

*/

const levels=[];

function createLevel(n){

let obj={

start:{

x:80,
y:200

},

platforms:[],

enemies:[],

portal:{

x:1160,
y:120,

w:60,
h:60

}

};

obj.platforms.push({

x:0,
y:680,
w:2000,
h:40

});

let x=120;

for(let i=0;i<7;i++){

obj.platforms.push({

x:x,

y:520-(i*40)+(Math.sin(i+n)*30),

w:170,

h:20

});

x+=170;

}

for(let i=0;i<4+n;i++){

obj.enemies.push({

x:250+i*120,

y:640,

w:40,

h:32,

dir:i%2==0?2:-2,

health:1

});

}

return obj;

}

for(let i=0;i<10;i++){

levels.push(

createLevel(i)

);

}

const boss1={

active:false,

x:900,

y:180,

w:180,

h:180,

health:40,

maxHealth:40,

cooldown:0

};

const boss2={

active:false,

x:820,

y:120,

w:260,

h:260,

health:80,

maxHealth:80,

phase:1,

cooldown:0

};

function saveGame(){

localStorage.setItem(

"neonrunnerx",

JSON.stringify({

level:game.level,

health:player.health,

highJump:player.highJump

})

);

}

function loadLevel(index){

game.level=index;

platforms.length=0;

enemies.length=0;

const L=levels[index];

L.platforms.forEach(p=>{

platforms.push(

structuredClone(p)

);

});

L.enemies.forEach(e=>{

enemies.push(

structuredClone(e)

);

});

portal=structuredClone(

L.portal

);

player.x=L.start.x;
player.y=L.start.y;

player.vx=0;
player.vy=0;

saveGame();

}

function rect(a,b){

return(

a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y

);

}

function shoot(){

if(player.laserCooldown>0)
return;

player.laserCooldown=10;

bullets.push({

x:player.direction==1?

player.x+player.w:

player.x,

y:player.y+22,

vx:player.direction*14,

w:16,

h:4

});

}

function enemyShoot(x,y,speed){

enemyBullets.push({

x:x,

y:y,

vx:speed,

w:10,

h:4

});

}
