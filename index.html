<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Neon Runner X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#02020a;
overflow:hidden;
font-family:Arial,sans-serif;

}

canvas{

display:block;
margin:auto;
background:linear-gradient(#050518,#170030);
image-rendering:pixelated;

}

#ui{

position:absolute;
top:10px;
left:10px;

color:#00ffff;

font-size:20px;

text-shadow:0 0 10px cyan;

z-index:10;

}

#message{

position:absolute;

width:100%;

top:45%;

text-align:center;

font-size:48px;

font-weight:bold;

color:white;

display:none;

text-shadow:

0 0 10px cyan,
0 0 25px magenta,
0 0 50px cyan;

}

</style>

</head>

<body>

<div id="ui"></div>

<div id="message"></div>

<canvas
id="game"
width="1280"
height="720">
</canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ui=document.getElementById("ui");
const message=document.getElementById("message");

const WIDTH=canvas.width;
const HEIGHT=canvas.height;

const gravity=.8;

const keys={};

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

});

document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});

const saveData=JSON.parse(

localStorage.getItem("neonrunnerx")

||

"null"

);

const game={

level:0,

boss:false,

state:"platform",

won:false,

cameraX:0

};

const player={

x:80,
y:100,

w:40,
h:56,

vx:0,
vy:0,

speed:5,

jump:15,

ground:false,

dash:0,

health:5,

laserCooldown:0,

highJump:false,

direction:1

};

if(saveData){

game.level=saveData.level||0;

player.health=saveData.health||5;

player.highJump=saveData.highJump||false;

if(player.highJump){

player.jump=22;

}

}

const bullets=[];

const enemyBullets=[];

const enemies=[];

const platforms=[];

let portal={};

const hiddenUpgrade={

x:18,
y:660,

w:14,
h:14,

found:player.highJump

};

/*

THIS IS THE ONLY ITEM
IN THE ENTIRE GAME.

It exists ONLY on Level 1.

*/

const levels=[];

function createLevel(n){

let obj={

start:{

x:80,
y:200

},

platforms:[],

enemies:[],

portal:{

x:1160,
y:120,

w:60,
h:60

}

};

obj.platforms.push({

x:0,
y:680,
w:2000,
h:40

});

let x=120;

for(let i=0;i<7;i++){

obj.platforms.push({

x:x,

y:520-(i*40)+(Math.sin(i+n)*30),

w:170,

h:20

});

x+=170;

}

for(let i=0;i<4+n;i++){

obj.enemies.push({

x:250+i*120,

y:640,

w:40,

h:32,

dir:i%2==0?2:-2,

health:1

});

}

return obj;

}

for(let i=0;i<10;i++){

levels.push(

createLevel(i)

);

}

const boss1={

active:false,

x:900,

y:180,

w:180,

h:180,

health:40,

maxHealth:40,

cooldown:0

};

const boss2={

active:false,

x:820,

y:120,

w:260,

h:260,

health:80,

maxHealth:80,

phase:1,

cooldown:0

};

function saveGame(){

localStorage.setItem(

"neonrunnerx",

JSON.stringify({

level:game.level,

health:player.health,

highJump:player.highJump

})

);

}

function loadLevel(index){

game.level=index;

platforms.length=0;

enemies.length=0;

const L=levels[index];

L.platforms.forEach(p=>{

platforms.push(

structuredClone(p)

);

});

L.enemies.forEach(e=>{

enemies.push(

structuredClone(e)

);

});

portal=structuredClone(

L.portal

);

player.x=L.start.x;
player.y=L.start.y;

player.vx=0;
player.vy=0;

saveGame();

}

function rect(a,b){

return(

a.x<b.x+b.w&&
a.x+a.w>b.x&&
a.y<b.y+b.h&&
a.y+a.h>b.y

);

}

function shoot(){

if(player.laserCooldown>0)
return;

player.laserCooldown=10;

bullets.push({

x:player.direction==1?

player.x+player.w:

player.x,

y:player.y+22,

vx:player.direction*14,

w:16,

h:4

});

}

function enemyShoot(x,y,speed){

enemyBullets.push({

x:x,

y:y,

vx:speed,

w:10,

h:4

});

}
function updatePlayer(){

if(keys["a"]||keys["arrowleft"]){

player.vx=-player.speed;
player.direction=-1;

}

else if(keys["d"]||keys["arrowright"]){

player.vx=player.speed;
player.direction=1;

}

else{

player.vx*=0.82;

}

const jumpKey=
keys[" "]||
keys["w"]||
keys["arrowup"];

if(jumpKey&&player.ground){

player.vy=-player.jump;
player.ground=false;

}

if(keys["shift"]&&player.dash<=0){

player.vx*=4;
player.dash=40;

}

if(keys["f"]){

shoot();

}

if(player.dash>0)
player.dash--;

if(player.laserCooldown>0)
player.laserCooldown--;

player.vy+=gravity;

player.x+=player.vx;
player.y+=player.vy;

player.ground=false;

for(const p of platforms){

if(

player.x+player.w>p.x&&
player.x<p.x+p.w&&
player.y+player.h>p.y&&
player.y+player.h<p.y+20&&
player.vy>=0

){

player.y=p.y-player.h;
player.vy=0;
player.ground=true;

}

}

if(player.y>900){

player.health--;

player.x=80;
player.y=100;

player.vx=0;
player.vy=0;

}

}

/***********************
HIDDEN UPGRADE
ONLY ITEM IN GAME
************************/

function checkHiddenUpgrade(){

if(

game.level!==0||
hiddenUpgrade.found

){

return;

}

if(

player.x<hiddenUpgrade.x+hiddenUpgrade.w&&
player.x+player.w>hiddenUpgrade.x&&
player.y<hiddenUpgrade.y+hiddenUpgrade.h&&
player.y+player.h>hiddenUpgrade.y

){

hiddenUpgrade.found=true;

player.highJump=true;

player.jump=22;

saveGame();

message.style.display="block";

message.innerHTML=
"HIDDEN HIGH JUMP MODULE FOUND";

setTimeout(()=>{

message.style.display="none";

},2500);

}

}

/***********************
PLAYER BULLETS
************************/

function updateBullets(){

for(let i=bullets.length-1;i>=0;i--){

const b=bullets[i];

b.x+=b.vx;

if(

b.x<-100||
b.x>2200

){

bullets.splice(i,1);
continue;

}

for(let j=enemies.length-1;j>=0;j--){

const e=enemies[j];

if(rect(b,e)){

enemies.splice(j,1);

bullets.splice(i,1);

break;

}

}

}

}

/***********************
ENEMIES
************************/

function updateEnemies(){

for(const e of enemies){

e.x+=e.dir;

if(

e.x<50||
e.x>1850

){

e.dir*=-1;

}

if(rect(player,e)){

player.health--;

player.x=80;
player.y=120;

}

}

}

/***********************
ENEMY BULLETS
************************/

function updateEnemyBullets(){

for(

let i=enemyBullets.length-1;
i>=0;
i--

){

const b=enemyBullets[i];

b.x+=b.vx;

if(

b.x<-100||
b.x>2200

){

enemyBullets.splice(i,1);
continue;

}

if(

player.x<b.x+b.w&&
player.x+player.w>b.x&&
player.y<b.y+b.h&&
player.y+player.h>b.y

){

enemyBullets.splice(i,1);

player.health--;

player.x=80;
player.y=120;

}

}

}

/***********************
LEVEL COMPLETE
************************/

function checkPortal(){

if(enemies.length>0)
return;

if(rect(player,portal)){

game.level++;

if(game.level==5){

game.state="boss1";
boss1.active=true;
return;

}

if(game.level>=10){

game.state="boss2";
boss2.active=true;
return;

}

loadLevel(game.level);

}

}

/***********************
BACKGROUND
************************/

function drawBackground(){

ctx.fillStyle="#040415";
ctx.fillRect(0,0,WIDTH,HEIGHT);

for(let i=0;i<80;i++){

ctx.fillStyle="rgba(255,0,255,.12)";

ctx.fillRect(

i*40-game.cameraX*.2,

220+

Math.sin(i)*35,

22,

500

);

}

ctx.strokeStyle="#00ffff22";

for(

let x=-100;
x<2500;
x+=40

){

ctx.beginPath();

ctx.moveTo(

x-game.cameraX*.4,

0

);

ctx.lineTo(

x-game.cameraX*.4,

HEIGHT

);

ctx.stroke();

}

}

/***********************
DRAW PLATFORMS
************************/

function drawPlatforms(){

ctx.shadowBlur=18;

ctx.shadowColor="#ff00ff";

ctx.fillStyle="#ff00ff";

for(const p of platforms){

ctx.fillRect(

p.x-game.cameraX,
p.y,
p.w,
p.h

);

}

}
function drawPlayer(){

ctx.save();

ctx.translate(
player.x-game.cameraX,
player.y
);

ctx.shadowBlur=15;
ctx.shadowColor="#00ffff";

/* legs */

ctx.fillStyle="#999";

ctx.fillRect(8,44,6,12);
ctx.fillRect(26,44,6,12);

/* body */

ctx.fillStyle="#55ccff";

ctx.fillRect(
6,
18,
28,
28
);

/* arms */

ctx.fillStyle="#bbbbbb";

ctx.fillRect(
0,
22,
6,
18
);

ctx.fillRect(
34,
22,
6,
18
);

/* head */

ctx.fillStyle="#dddddd";

ctx.fillRect(
5,
0,
30,
20
);

/* eyes */

ctx.fillStyle="#00ffff";

ctx.fillRect(
11,
7,
4,
4
);

ctx.fillRect(
25,
7,
4,
4
);

/* mouth */

ctx.fillStyle="#666";

for(let i=0;i<5;i++){

ctx.fillRect(
10+i*4,
15,
2,
1
);

}

/* antenna */

ctx.strokeStyle="#ff00ff";

ctx.beginPath();

ctx.moveTo(
20,
0
);

ctx.lineTo(
20,
-10
);

ctx.stroke();

ctx.fillStyle="#ff00ff";

ctx.beginPath();

ctx.arc(
20,
-12,
2,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}

/************************
DRAW ENEMIES
************************/

function drawEnemies(){

ctx.shadowBlur=12;
ctx.shadowColor="#00ff88";

for(const e of enemies){

ctx.fillStyle="#00ff88";

ctx.fillRect(
e.x-game.cameraX,
e.y,
e.w,
e.h
);

ctx.fillStyle="#ff3333";

ctx.fillRect(
e.x-game.cameraX+8,
e.y+8,
5,
5
);

ctx.fillRect(
e.x-game.cameraX+26,
e.y+8,
5,
5
);

}

}

/************************
DRAW BULLETS
************************/

function drawBullets(){

ctx.shadowBlur=10;

ctx.shadowColor="#00ffff";

ctx.fillStyle="#00ffff";

for(const b of bullets){

ctx.fillRect(

b.x-game.cameraX,
b.y,
b.w,
b.h

);

}

ctx.shadowColor="#ff4444";
ctx.fillStyle="#ff4444";

for(const b of enemyBullets){

ctx.fillRect(

b.x-game.cameraX,
b.y,
b.w,
b.h

);

}

}

/************************
DRAW SECRET MODULE
************************/

function drawHiddenUpgrade(){

if(

game.level!==0||
hiddenUpgrade.found

)return;

/* intentionally difficult to notice */

ctx.shadowBlur=4;

ctx.shadowColor="#00ffaa";

ctx.fillStyle="rgba(0,255,255,.08)";

ctx.fillRect(

hiddenUpgrade.x-game.cameraX,
hiddenUpgrade.y,
hiddenUpgrade.w,
hiddenUpgrade.h

);

}

/************************
DRAW PORTAL
************************/

function drawPortal(){

if(enemies.length>0)
return;

ctx.shadowBlur=20;

ctx.shadowColor="#ffff00";

ctx.strokeStyle="#ffff00";

ctx.lineWidth=4;

ctx.beginPath();

ctx.arc(

portal.x+30-game.cameraX,
portal.y+30,
24,
0,
Math.PI*2

);

ctx.stroke();

}

/************************
LEVEL 5 BOSS
************************/

function updateBoss1(){

if(!boss1.active)
return;

boss1.cooldown--;

if(boss1.cooldown<=0){

enemyShoot(

boss1.x,
boss1.y+70,
-8

);

boss1.cooldown=35;

}

for(

let i=bullets.length-1;
i>=0;
i--

){

const b=bullets[i];

b.x+=b.vx;

if(

b.x<boss1.x+boss1.w&&
b.x+b.w>boss1.x&&
b.y<boss1.y+boss1.h&&
b.y+b.h>boss1.y

){

boss1.health--;

bullets.splice(i,1);

if(boss1.health<=0){

boss1.active=false;

game.state="platform";

loadLevel(5);

}

}

}

updateEnemyBullets();

}

function drawBoss1(){

ctx.shadowBlur=25;

ctx.shadowColor="#ff00ff";

ctx.fillStyle="#9933ff";

ctx.fillRect(

boss1.x,
boss1.y,
boss1.w,
boss1.h

);

ctx.fillStyle="#00ffff";

ctx.fillRect(
boss1.x+35,
boss1.y+40,
22,
22
);

ctx.fillRect(
boss1.x+120,
boss1.y+40,
22,
22
);

/* health bar */

ctx.fillStyle="#222";

ctx.fillRect(
220,
30,
600,
20
);

ctx.fillStyle="#ff4444";

ctx.fillRect(
220,
30,
600*(boss1.health/boss1.maxHealth),
20
);

ctx.strokeStyle="#ffffff";

ctx.strokeRect(
220,
30,
600,
20
);

}
