<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Neon Runner X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#03030d;
overflow:hidden;
font-family:Arial,sans-serif;

}

canvas{

display:block;
margin:auto;
background:linear-gradient(#050518,#170030);
image-rendering:pixelated;

}

#ui{

position:absolute;
left:10px;
top:10px;
color:#00ffff;
font-size:20px;
text-shadow:0 0 10px cyan;
z-index:10;

}

#message{

position:absolute;
width:100%;
top:45%;
text-align:center;
font-size:48px;
font-weight:bold;
color:#ffffff;
text-shadow:
0 0 10px cyan,
0 0 25px magenta;

display:none;

}

</style>

</head>

<body>

<div id="ui"></div>
<div id="message"></div>

<canvas
id="game"
width="1000"
height="600">
</canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ui=document.getElementById("ui");
const message=document.getElementById("message");

const WIDTH=canvas.width;
const HEIGHT=canvas.height;

const gravity=.8;

const keys={};

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

});

document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});

const game={

level:0,
state:"platform",
boss:false,
won:false

};

const player={

x:80,
y:200,

w:36,
h:52,

vx:0,
vy:0,

speed:5,

jump:15,

ground:false,

dashTimer:0,

health:5,

laserCooldown:0,

highJump:false

};

const bullets=[];

const enemyBullets=[];

const enemies=[];

const platforms=[];

let portal={};

const hiddenModule={

x:42,
y:522,
w:12,
h:12,
found:false

};

/*

THIS IS THE ONLY UPGRADE ITEM
IN THE ENTIRE GAME.

It is hidden on Level 1 and
permanently upgrades jump height.

*/

const levels=[];

function makeLevel(index){

const baseY=560;

const obj={

start:{
x:80,
y:200
},

platforms:[
{x:0,y:baseY,w:1000,h:40}
],

enemies:[],

portal:{
x:920,
y:120,
w:60,
h:60
}

};

let px=120;

for(let i=0;i<5;i++){

obj.platforms.push({

x:px,
y:470-i*55,
w:140,
h:20

});

px+=160;

}

for(let i=0;i<4+Math.floor(index/2);i++){

obj.enemies.push({

x:220+i*110,
y:530,

w:36,
h:30,

dir:i%2===0?2:-2,

health:1

});

}

return obj;

}

for(let i=0;i<10;i++){

levels.push(makeLevel(i));

}

/*

Boss battles will occur:

After Level 5
After Level 10

*/

const bossOne={

active:false,

health:30,

maxHealth:30,

x:760,
y:160,

w:150,
h:150,

cooldown:0

};

const finalBoss={

active:false,

health:60,

maxHealth:60,

x:700,
y:120,

w:220,
h:220,

phase:1,

cooldown:0

};

function loadLevel(n){

game.level=n;

platforms.length=0;
enemies.length=0;

const L=levels[n];

L.platforms.forEach(p=>{

platforms.push(
structuredClone(p)
);

});

L.enemies.forEach(e=>{

enemies.push(
structuredClone(e)
);

});

portal=structuredClone(
L.portal
);

player.x=L.start.x;
player.y=L.start.y;

player.vx=0;
player.vy=0;

}

function rect(a,b){

return(

a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y

);

}

function shoot(){

if(player.laserCooldown>0)
return;

player.laserCooldown=12;

bullets.push({

x:player.x+player.w,

y:player.y+18,

vx:12,

w:12,
h:4

});

}

function bossShoot(x,y){

enemyBullets.push({

x:x,
y:y,

vx:-8,

w:10,
h:4

});

}
