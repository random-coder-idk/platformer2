<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Neon Runner X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#03030d;
overflow:hidden;
font-family:Arial,sans-serif;

}

canvas{

display:block;
margin:auto;
background:linear-gradient(#050518,#170030);
image-rendering:pixelated;

}

#ui{

position:absolute;
left:10px;
top:10px;
color:#00ffff;
font-size:20px;
text-shadow:0 0 10px cyan;
z-index:10;

}

#message{

position:absolute;
width:100%;
top:45%;
text-align:center;
font-size:48px;
font-weight:bold;
color:#ffffff;
text-shadow:
0 0 10px cyan,
0 0 25px magenta;

display:none;

}

</style>

</head>

<body>

<div id="ui"></div>
<div id="message"></div>

<canvas
id="game"
width="1000"
height="600">
</canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const ui=document.getElementById("ui");
const message=document.getElementById("message");

const WIDTH=canvas.width;
const HEIGHT=canvas.height;

const gravity=.8;

const keys={};

document.addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

});

document.addEventListener("keyup",e=>{

keys[e.key.toLowerCase()]=false;

});

const game={

level:0,
state:"platform",
boss:false,
won:false

};

const player={

x:80,
y:200,

w:36,
h:52,

vx:0,
vy:0,

speed:5,

jump:15,

ground:false,

dashTimer:0,

health:5,

laserCooldown:0,

highJump:false

};

const bullets=[];

const enemyBullets=[];

const enemies=[];

const platforms=[];

let portal={};

const hiddenModule={

x:42,
y:522,
w:12,
h:12,
found:false

};

/*

THIS IS THE ONLY UPGRADE ITEM
IN THE ENTIRE GAME.

It is hidden on Level 1 and
permanently upgrades jump height.

*/

const levels=[];

function makeLevel(index){

const baseY=560;

const obj={

start:{
x:80,
y:200
},

platforms:[
{x:0,y:baseY,w:1000,h:40}
],

enemies:[],

portal:{
x:920,
y:120,
w:60,
h:60
}

};

let px=120;

for(let i=0;i<5;i++){

obj.platforms.push({

x:px,
y:470-i*55,
w:140,
h:20

});

px+=160;

}

for(let i=0;i<4+Math.floor(index/2);i++){

obj.enemies.push({

x:220+i*110,
y:530,

w:36,
h:30,

dir:i%2===0?2:-2,

health:1

});

}

return obj;

}

for(let i=0;i<10;i++){

levels.push(makeLevel(i));

}

/*

Boss battles will occur:

After Level 5
After Level 10

*/

const bossOne={

active:false,

health:30,

maxHealth:30,

x:760,
y:160,

w:150,
h:150,

cooldown:0

};

const finalBoss={

active:false,

health:60,

maxHealth:60,

x:700,
y:120,

w:220,
h:220,

phase:1,

cooldown:0

};

function loadLevel(n){

game.level=n;

platforms.length=0;
enemies.length=0;

const L=levels[n];

L.platforms.forEach(p=>{

platforms.push(
structuredClone(p)
);

});

L.enemies.forEach(e=>{

enemies.push(
structuredClone(e)
);

});

portal=structuredClone(
L.portal
);

player.x=L.start.x;
player.y=L.start.y;

player.vx=0;
player.vy=0;

}

function rect(a,b){

return(

a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y

);

}

function shoot(){

if(player.laserCooldown>0)
return;

player.laserCooldown=12;

bullets.push({

x:player.x+player.w,

y:player.y+18,

vx:12,

w:12,
h:4

});

}

function bossShoot(x,y){

enemyBullets.push({

x:x,
y:y,

vx:-8,

w:10,
h:4

});

}
function updatePlayer(){ if(keys["a"]||keys["arrowleft"]){ player.vx=-player.speed; } else if(keys["d"]||keys["arrowright"]){ player.vx=player.speed; } else{ player.vx*=0.82; } const jumpKey= keys[" "]|| keys["w"]|| keys["arrowup"]; if(jumpKey&&player.ground){ player.vy=-player.jump; player.ground=false; } if(keys["shift"]&&player.dashTimer<=0){ player.vx*=4; player.dashTimer=40; } if(keys["f"]){ shoot(); } if(player.laserCooldown>0) player.laserCooldown--; if(player.dashTimer>0) player.dashTimer--; player.vy+=gravity; player.x+=player.vx; player.y+=player.vy; player.ground=false; for(const p of platforms){ if( player.x+player.w>p.x&& player.x<p.x+p.w&& player.y+player.h>p.y&& player.y+player.h<p.y+22&& player.vy>=0 ){ player.y=p.y-player.h; player.vy=0; player.ground=true; } } /* hidden module */ if( game.level===0&& !hiddenModule.found&& player.x<hiddenModule.x+hiddenModule.w&& player.x+player.w>hiddenModule.x&& player.y<hiddenModule.y+hiddenModule.h&& player.y+player.h>hiddenModule.y ){ hiddenModule.found=true; player.highJump=true; player.jump=22; message.style.display="block"; message.innerHTML="HIGH JUMP MODULE FOUND"; setTimeout(()=>{ message.style.display="none"; },2000); } if(player.y>HEIGHT+200){ player.health--; player.x=80; player.y=100; player.vx=0; player.vy=0; } } function updateBullets(){ for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i]; b.x+=b.vx; if(b.x>WIDTH+100){ bullets.splice(i,1); continue; } for(let j=enemies.length-1;j>=0;j--){ const e=enemies[j]; if(rect(b,e)){ enemies.splice(j,1); bullets.splice(i,1); break; } } } } function updateEnemies(){ for(const e of enemies){ e.x+=e.dir; if(e.x<40||e.x>920){ e.dir*=-1; } if(rect(player,e)){ player.health--; player.x=80; player.y=120; } } } function checkPortal(){ if(enemies.length>0) return; if(rect(player,portal)){ game.level++; if(game.level===5){ game.state="boss"; bossOne.active=true; return; } if(game.level>=10){ game.state="finalBoss"; finalBoss.active=true; return; } loadLevel(game.level); } } function drawBackground(){ for(let i=0;i<45;i++){ ctx.fillStyle="rgba(255,0,255,.12)"; ctx.fillRect( i*28, 180+Math.sin(i)*25, 20, 420 ); } ctx.strokeStyle="#00ffff22"; for(let x=0;x<WIDTH;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,HEIGHT); ctx.stroke(); } } function drawPlatforms(){ ctx.shadowBlur=18; ctx.shadowColor="#ff00ff"; ctx.fillStyle="#ff00ff"; for(const p of platforms){ ctx.fillRect( p.x, p.y, p.w, p.h ); } } function drawHiddenModule(){ if( game.level!==0|| hiddenModule.found )return; /* intentionally subtle */ ctx.shadowBlur=5; ctx.shadowColor="#00ffaa"; ctx.fillStyle="rgba(0,255,255,.08)"; ctx.fillRect( hiddenModule.x, hiddenModule.y, hiddenModule.w, hiddenModule.h ); } function drawRobot(){ ctx.shadowBlur=14; ctx.shadowColor="#00ffff"; /* body */ ctx.fillStyle="#79d8ff"; ctx.fillRect( player.x+6, player.y+18, 24, 26 ); /* head */ ctx.fillStyle="#d8d8d8"; ctx.fillRect( player.x+4, player.y, 28, 18 ); /* eyes */ ctx.fillStyle="#00ffff"; ctx.fillRect( player.x+9, player.y+6, 4, 4 ); ctx.fillRect( player.x+22, player.y+6, 4, 4 ); /* mouth */ ctx.fillStyle="#555"; for(let i=0;i<5;i++){ ctx.fillRect( player.x+8+i*4, player.y+13, 2, 1 ); } /* antenna */ ctx.strokeStyle="#ff00ff"; ctx.beginPath(); ctx.moveTo( player.x+18, player.y ); ctx.lineTo( player.x+18, player.y-8 ); ctx.stroke(); ctx.fillStyle="#ff00ff"; ctx.beginPath(); ctx.arc( player.x+18, player.y-10, 2, 0, Math.PI*2 ); ctx.fill(); /* arms */ ctx.fillStyle="#bbbbbb"; ctx.fillRect( player.x, player.y+20, 6, 16 ); ctx.fillRect( player.x+30, player.y+20, 6, 16 ); /* legs */ ctx.fillRect( player.x+8, player.y+44, 5, 8 ); ctx.fillRect( player.x+22, player.y+44, 5, 8 ); }
